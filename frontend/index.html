<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Onboard applications to Kubernetes with KubeOps." />
    <meta name="color-scheme" content="light dark" />
    <title>KubeOps</title>
    <script>
      // Resolves the theme before first paint so a dark reload never flashes
      // light. The stored choice may be "system" (or absent, which means the
      // same), so the system preference is read here too; the resolved value
      // is always written because the token sheet keys off it. useTheme owns
      // the attribute from mount onwards.
      ;(function () {
        var preference = 'system'
        try {
          var stored = localStorage.getItem('kubeops-theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch (error) {
          // Blocked storage just means we follow the system preference.
        }
        var dark =
          preference === 'dark' ||
          (preference === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
