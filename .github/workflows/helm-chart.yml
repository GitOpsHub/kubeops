name: Helm chart

on:
  pull_request:
    paths:
      - charts/kubeops/**
      - .github/workflows/helm-chart.yml
  push:
    branches:
      - main
    tags:
      - helm-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helm-chart-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CHART_PATH: charts/kubeops
  HELM_VERSION: v4.0.4

jobs:
  validate:
    name: Validate (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: default
            values: charts/kubeops/ci/default-values.yaml
          - platform: eks
            values: charts/kubeops/ci/eks-values.yaml
          - platform: gke
            values: charts/kubeops/ci/gke-values.yaml
          - platform: aks
            values: charts/kubeops/ci/aks-values.yaml
          - platform: minikube
            values: charts/kubeops/ci/minikube-values.yaml
          - platform: docker-desktop
            values: charts/kubeops/ci/docker-desktop-values.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Lint chart
        run: helm lint "$CHART_PATH" --strict --values "${{ matrix.values }}"

      - name: Render chart
        run: >-
          helm template kubeops-test "$CHART_PATH"
          --namespace kubeops-test
          --values "${{ matrix.values }}"

  publish:
    name: Publish OCI chart
    if: startsWith(github.ref, 'refs/tags/helm-v')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Interpolated once here rather than inside each run block, so no workflow
      # expression is ever expanded straight into a shell command.
      REGISTRY_OWNER: ${{ github.repository_owner }}
      REGISTRY_USER: ${{ github.actor }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Resolve chart coordinates
        shell: bash
        run: |
          chart_version="$(helm show chart "$CHART_PATH" | awk '$1 == "version:" { print $2 }')"
          tag_version="${GITHUB_REF_NAME#helm-v}"
          if [[ "$tag_version" != "$chart_version" ]]; then
            echo "Tag version $tag_version does not match Chart.yaml version $chart_version" >&2
            exit 1
          fi
          owner="$(echo "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"
          {
            echo "CHART_OWNER=$owner"
            echo "CHART_VERSION=$tag_version"
            echo "CHART_REPO=oci://ghcr.io/$owner/charts"
          } >> "$GITHUB_ENV"

      - name: Package chart
        run: helm package "$CHART_PATH" --destination dist

      - name: Log in to GitHub Container Registry
        shell: bash
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            helm registry login ghcr.io \
              --username "$REGISTRY_USER" \
              --password-stdin

      - name: Publish chart
        shell: bash
        run: |
          if helm push "dist/kubeops-${CHART_VERSION}.tgz" "$CHART_REPO"; then
            exit 0
          fi
          # A bare 403 from the registry gives no hint about the cause, which is
          # almost always that the package predates this workflow and is not linked
          # to the repository, so GITHUB_TOKEN has no write access to it.
          {
            echo
            echo "helm push failed. If the error above is 403 Forbidden, the package"
            echo "already exists on ghcr.io but is not linked to this repository, so"
            echo "GITHUB_TOKEN cannot write to it. A package administrator must grant"
            echo "this repository the Write role under 'Manage Actions access' at:"
            echo "  https://github.com/orgs/${CHART_OWNER}/packages/container/charts%2Fkubeops/settings"
          } >&2
          exit 1

      - name: Verify published chart
        shell: bash
        run: |
          helm show chart "${CHART_REPO}/kubeops" --version "$CHART_VERSION" >/dev/null
          echo "Published ${CHART_REPO}/kubeops:${CHART_VERSION}"

      - name: Check anonymous pull
        shell: bash
        env:
          # An empty registry config guarantees the probe is unauthenticated. Logging
          # out would leave Helm free to fall back to any other credential store.
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/anonymous-registry.json
        run: |
          # Argo CD pulls this chart without credentials, so a private package fails
          # at deploy time with an opaque 401 long after a green publish. Report it
          # here instead of failing: a private package plus registry credentials in
          # Argo CD is a valid setup.
          echo '{}' > "$HELM_REGISTRY_CONFIG"
          if helm show chart "${CHART_REPO}/kubeops" --version "$CHART_VERSION" >/dev/null 2>&1; then
            echo "Chart is anonymously pullable."
            exit 0
          fi
          echo "::warning title=Chart is not anonymously pullable::${CHART_REPO}/kubeops:${CHART_VERSION} published, but an unauthenticated pull was refused. Argo CD will fail with a 401 unless the package is made public or the Argo CD instances are given registry credentials."
