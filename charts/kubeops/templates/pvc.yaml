{{- $prefix := include "kubeops.pvcPrefix" . }}
{{- if and .Values.persistence.enabled (eq .Values.workload.kind "Deployment") (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" $prefix .Values.persistence.name }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
    {{- with .Values.persistence.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if .Values.persistence.retainOnDelete }}
    # Helm deletes every object it created on uninstall. Application data is
    # rarely meant to go with it, so the claim is kept by default.
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .Values.persistence.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "kubeops.claimSpec" .Values.persistence | nindent 2 }}
{{- end }}
{{- range .Values.extraPersistentVolumeClaims }}
{{- if not .existingClaim }}
---
# A shared claim, mounted by every replica of the workload.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-%s" $prefix .name }}
  labels:
    {{- include "kubeops.labels" $ | nindent 4 }}
    {{- with .labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  annotations:
    {{- if ne .retainOnDelete false }}
    helm.sh/resource-policy: keep
    {{- end }}
    {{- with .annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- include "kubeops.claimSpec" . | nindent 2 }}
{{- end }}
{{- end }}
