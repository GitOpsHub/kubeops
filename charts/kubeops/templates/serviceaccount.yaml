{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeops.serviceAccountName" . }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
    {{- with .Values.serviceAccount.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with (include "kubeops.serviceAccountAnnotations" . | trim) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubeops.resourceName" (dict "root" . "suffix" "role") }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeops.resourceName" (dict "root" . "suffix" "rolebinding") }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubeops.resourceName" (dict "root" . "suffix" "role") }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeops.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- range .Values.rbac.clusterRoleBindings }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubeops.resourceName" (dict "root" $ "suffix" (printf "%s-binding" .)) }}
  labels:
    {{- include "kubeops.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeops.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
