{{- if .Values.secretsStore.enabled }}
# The Secrets Store CSI Driver mounts provider secrets as files at
# secretsStore.mountPath. `secretObjects` additionally mirrors them into a
# Kubernetes Secret, which is what makes them available as environment
# variables. Mirrored Secrets only exist while a pod mounts the volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "kubeops.secretProviderClassName" . }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
  {{- with .Values.secretsStore.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  provider: {{ .Values.secretsStore.provider }}
  {{- with .Values.secretsStore.parameters }}
  parameters:
    {{- range $key, $value := . }}
    {{- if or (kindIs "map" $value) (kindIs "slice" $value) }}
    {{ $key }}: |
      {{- toYaml $value | nindent 6 }}
    {{- else }}
    {{ $key }}: {{ toString $value | quote }}
    {{- end }}
    {{- end }}
  {{- end }}
  {{- with .Values.secretsStore.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
