{{- if .Values.secret.enabled }}
# Anything under `secret.stringData` is stored in Git and in the Helm release
# Secret in plain text. Use `externalSecret` or `secretsStore` for real
# credentials; this object is for placeholders and local development.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "kubeops.secretName" . }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- with .Values.secret.stringData }}
stringData:
  {{- range $key, $value := . }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
