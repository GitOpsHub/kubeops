{{- if .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "kubeops.resourceName" (dict "root" . "suffix" "test") }}
  labels:
    {{- include "kubeops.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    # Deleting on success would race `helm test --logs`, which reads the pod
    # after the hook completes. Cleaning up before the next run instead keeps
    # the logs readable without letting test pods accumulate.
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: connection
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      command:
        - wget
      args:
        - --spider
        - --timeout=10
        - --tries=3
        - "http://{{ include "kubeops.serviceName" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness.path }}"
      resources:
        limits:
          cpu: 100m
          memory: 32Mi
        requests:
          cpu: 10m
          memory: 16Mi
{{- end }}
