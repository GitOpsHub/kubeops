# Azure Kubernetes Service: every integration this chart offers, exercised
# together.
#
# Cluster prerequisites:
#   - Application routing add-on         (Ingress class webapprouting.kubernetes.azure.com)
#   - Azure Disk CSI driver              (per-replica block storage, on by default)
#   - Azure File CSI driver              (shared ReadWriteMany storage, on by default)
#   - Azure Blob CSI driver add-on       (storage.csiVolumes)
#   - Azure Workload Identity + OIDC     (serviceAccount.azure)
#   - Secrets Store CSI Driver + Key Vault provider
#   - External Secrets Operator          (externalSecret)
#   - Azure Monitor managed Prometheus   (metrics.serviceMonitor)
#
# Subscription IDs, client IDs and resource names below are placeholders.

workload:
  kind: StatefulSet
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

replicaCount: 3

image:
  repository: nginxinc/nginx-unprivileged
  tag: "1.27-alpine"

serviceAccount:
  create: true
  azure:
    # Azure Workload Identity. The federated credential on the managed identity
    # is created outside the chart; this annotates the ServiceAccount and adds
    # the azure.workload.identity/use label to the pod.
    clientId: 00000000-0000-0000-0000-000000000000
    tenantId: 11111111-1111-1111-1111-111111111111

podSecurityContext:
  runAsNonRoot: true
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  # The application routing add-on creates this IngressClass; referencing it is
  # what activates the managed NGINX controller for this Ingress.
  className: webapprouting.kubernetes.azure.com
  azure:
    appRouting:
      enabled: true
      # The add-on pulls the certificate from Key Vault and creates the Secret
      # named in ingress.tls below.
      tlsCertKeyVaultUri: https://kubeops-kv.vault.azure.net/certificates/app-example-com/00000000000000000000000000000000
  annotations:
    # The managed controller is NGINX, so NGINX annotations apply.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 8m
  hosts:
    - host: app.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - app.example.com
      secretName: app-example-com-tls

# Premium SSD v2 and Premium_LRS are the production tiers; StandardSSD_LRS
# suits lower-throughput workloads.
persistence:
  enabled: true
  name: data
  mountPath: /var/lib/app
  storageClassName: kubeops-azuredisk-premium
  accessModes:
    - ReadWriteOnce
  size: 20Gi

# Azure Files is the ReadWriteMany option on AKS.
extraPersistentVolumeClaims:
  - name: shared
    mountPath: /var/shared
    storageClassName: kubeops-azurefile-premium
    accessModes:
      - ReadWriteMany
    # Premium file shares are provisioned in 100 GiB increments.
    size: 100Gi

storage:
  emptyDirs:
    - name: tmp
      mountPath: /tmp
      medium: Memory
      sizeLimit: 64Mi
  csiVolumes:
    - name: assets
      mountPath: /var/assets
      driver: blob.csi.azure.com
      readOnly: true
      volumeAttributes:
        containerName: assets
        mountOptions: "-o allow_other --file-cache-timeout-in-seconds=120"
        protocol: fuse2
  classes:
    create: true
    items:
      - name: kubeops-azuredisk-premium
        provisioner: disk.csi.azure.com
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        volumeBindingMode: WaitForFirstConsumer
        parameters:
          skuName: PremiumV2_LRS
          cachingMode: None
          csi.storage.k8s.io/fstype: ext4
      - name: kubeops-azurefile-premium
        provisioner: file.csi.azure.com
        reclaimPolicy: Delete
        allowVolumeExpansion: true
        # Azure Files provisions a share in a storage account, not a node-local
        # disk, so there is nothing to wait for.
        volumeBindingMode: Immediate
        parameters:
          skuName: Premium_LRS
          protocol: nfs
        mountOptions:
          # nconnect opens parallel TCP connections; noresvport keeps the mount
          # alive across storage-account failovers.
          - nconnect=4
          - noresvport
          - actimeo=30
          - rsize=262144
          - wsize=262144
  snapshotClasses:
    create: true
    items:
      - name: kubeops-azuredisk-snapshots
        driver: disk.csi.azure.com
        deletionPolicy: Delete
        parameters:
          incremental: "true"

secretsStore:
  enabled: true
  provider: azure
  mountPath: /mnt/secrets
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload identity: the same client ID as the ServiceAccount above.
    clientID: 00000000-0000-0000-0000-000000000000
    tenantId: 11111111-1111-1111-1111-111111111111
    keyvaultName: kubeops-kv
    objects: |
      array:
        - |
          objectName: kubeops-db-password
          objectType: secret
          objectAlias: DATABASE_PASSWORD
  secretObjects:
    - secretName: kubeops-app-secrets
      type: Opaque
      data:
        - objectName: DATABASE_PASSWORD
          key: DATABASE_PASSWORD
  asEnvFrom: true

externalSecret:
  enabled: true
  secretStoreRef:
    name: azure-key-vault
    kind: ClusterSecretStore
  refreshInterval: 1h
  data:
    - secretKey: API_TOKEN
      remoteRef:
        key: kubeops-api-token
  asEnvFrom: true

metrics:
  enabled: true
  port: 9090
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

networkPolicy:
  enabled: true
  allowExternal: true
  egress:
    enabled: true
    allowDNS: true

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: kubeops

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
