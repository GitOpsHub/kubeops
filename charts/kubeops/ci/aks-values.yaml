# AKS, minimal: expose the application through a cloud load balancer only.
# See aks-full-values.yaml for ingress, storage and the identity integrations.
service:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  azure:
    loadBalancer:
      # Set internal to true for a load balancer reachable only from the VNet.
      internal: false
      healthProbeRequestPath: /
