apiVersion: v2
name: kubeops
description: Reusable global application chart for KubeOps onboarding, with opt-in EKS, AKS and GKE ingress, storage and identity integrations
type: application
version: 1.1.0
appVersion: "1.0.0"
# autoscaling/v2 needs 1.23 and Service.spec.internalTrafficPolicy needs 1.26.
# StatefulSet persistentVolumeClaimRetentionPolicy is honoured from 1.27 and
# silently ignored below it.
kubeVersion: ">=1.25.0-0"
home: https://github.com/GitOpsHub/kubeops
sources:
  - https://github.com/GitOpsHub/kubeops/tree/main/charts/kubeops
keywords:
  - kubeops
  - application
  - kubernetes
  - gitops
  - eks
  - aks
  - gke
  - ingress
  - storage
maintainers:
  - name: Navaneeth
annotations:
  org.opencontainers.image.source: https://github.com/GitOpsHub/kubeops
